# Render Blueprint for the Django API. The React frontend is deployed on Vercel.
services:
  - type: web
    name: routecast-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TOMTOM_API_KEY
        sync: false # set in the Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://routecast.vercel.app
